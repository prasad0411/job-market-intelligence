# Full dashboard stack: the React app behind nginx, and the read only API reading your local pipeline data.
#   docker compose -f docker-compose.dashboard.yml up --build    then open http://localhost:8095
services:
  api:
    build: ./dashboard_api
    image: jmi-dashboard-api:local
    environment:
      JMI_LOCAL_DIR: /data
    volumes:
      - ./.local:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./dashboard-web
    image: jmi-dashboard-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8095:8080"
