name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pytest beautifulsoup4 requests dnspython gspread oauth2client msal pyyaml \
            google-api-python-client google-auth-httplib2 google-auth-oauthlib \
            numpy pandas scikit-learn

      - name: Lint ratchet
        run: |
          pip install ruff==0.16.5
          BASE=$(cat .ruff_baseline)
          NOW=$(ruff check . --statistics | sed -n 's/^Found \([0-9]*\) error.*/\1/p')
          NOW=${NOW:-0}
          echo "baseline $BASE, current $NOW"
          if [ "$NOW" -gt "$BASE" ]; then
            echo "::error::lint count rose from $BASE to $NOW"
            ruff check . --output-format concise
            exit 1
          fi
          if [ "$NOW" -lt "$BASE" ]; then
            echo "::notice::down to $NOW - lower .ruff_baseline to lock it in"
          fi

      - name: Seed minimal state
        run: |
          mkdir -p .local
          python -c "import json, pathlib; p = pathlib.Path('.local/brain.json'); p.exists() or p.write_text(json.dumps({'domains':{},'companies':{},'patterns':{'global_success_rates':{},'total_attempts':0,'total_successes':0},'apis':{},'mx_cache':{},'job_id_registry':{},'discovered_ats':{},'known_ats_slugs':{},'learned_clearance':[],'learned_non_tech':[],'learned_slugs':{},'learned_company_names':{},'user_blacklist_companies':['philips','morse corp'],'user_blacklist_titles':[],'url_company_cache':{},'issue_log':[],'run_history':{},'simplify_retry_queue':{},'source_quality':{}}, indent=2))"

      - name: Run tests
        run: pytest tests/ -v --tb=short
