server {
    listen 8080;
    root /usr/share/nginx/html;

    # The browser calls /api/...; nginx forwards it to the API container without the /api prefix
    location /api/ {
        proxy_pass http://api:8001/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change, so they can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is always revalidated so a new deploy shows up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
